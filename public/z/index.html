<meta name="claude:viewport-fit-sides" content="cover">
<title>For Zeeniya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300;400&display=swap">

<style>
/* Layout: six full-height scenes down one quiet column. Light rises for the
   greeting, dims scene by scene, and settles to near-dark at the last line. */
:root{
  --ink:#F2E9E4;
  --ink-soft:#A89B97;
  --ink-faint:#6E6260;
  --ground:#0E0C10;
  --ground-2:#17131A;
  --bloom:#E5A3A3;
  --bloom-deep:#B06A72;
  --leaf:#7D8C7A;
  --gold:#D9B98C;
  --display:'Cormorant Garamond','Hoefler Text',Georgia,serif;
  --body:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme: dark;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
html{scroll-behavior:smooth}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:var(--body);
  font-weight:300;
  line-height:1.65;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ambient layers */
#dust{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#glow{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(70vmax 50vmax at 50% 18%, rgba(229,163,163,.16) 0%, transparent 62%),
    radial-gradient(60vmax 45vmax at 12% 72%, rgba(217,185,140,.10) 0%, transparent 60%),
    radial-gradient(70vmax 55vmax at 92% 92%, rgba(125,140,122,.09) 0%, transparent 62%);
  transition:opacity 1.6s ease;
}

.wrap{
  position:relative;z-index:2;
  max-width:42rem;margin-inline:auto;
  padding-left:max(22px, env(safe-area-inset-left, 0px));
  padding-right:max(22px, env(safe-area-inset-right, 0px));
}

.scene{
  min-height:100svh;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;gap:1.4rem;
  padding-block:5rem;
}

/* ---------- type ---------- */
h1{
  font-family:var(--display);font-weight:300;
  font-size:clamp(2.9rem,13vw,6rem);
  line-height:1.02;margin:0;letter-spacing:-.01em;
  text-wrap:balance;
}
h1 .name{
  display:block;font-style:italic;
  background:linear-gradient(100deg,var(--bloom) 0%,var(--gold) 55%,var(--bloom-deep) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.line{
  font-family:var(--display);font-weight:300;
  font-size:clamp(1.6rem,6.2vw,2.9rem);
  line-height:1.3;margin:0;max-width:22ch;text-wrap:balance;
  color:var(--ink);
}
.line.soft{color:var(--ink-soft);font-style:italic}
.line.faint{color:var(--ink-faint)}
.eyebrow{
  font-size:.68rem;letter-spacing:.38em;text-transform:uppercase;
  color:var(--gold);font-weight:300;margin:0;opacity:.85;
}

/* word-by-word entrance */
.w{display:inline-block;opacity:0;transform:translateY(.5em);filter:blur(5px)}
.in .w{animation:rise .95s cubic-bezier(.22,.7,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none;filter:blur(0)}}

/* general reveal */
.r{opacity:0;transform:translateY(22px);transition:opacity 1.1s cubic-bezier(.2,.7,.2,1),transform 1.1s cubic-bezier(.2,.7,.2,1)}
.r.in{opacity:1;transform:none}

/* ---------- scene 1 candle ---------- */
.candle{width:min(60px,18vw);margin-bottom:.4rem}
.flame{transform-origin:50% 100%;animation:flick 2.4s ease-in-out infinite alternate}
@keyframes flick{
  0%{transform:scale(1) rotate(-2deg);opacity:.9}
  100%{transform:scale(1.1) rotate(3deg);opacity:1}
}

/* ---------- scene 4 flowers ---------- */
.bouquet{width:min(260px,66vw);max-width:100%;margin-block:.4rem}
.stem,.petal,.leaf{opacity:0}
.in .stem{animation:draw 1.4s ease forwards}
.in .petal{animation:bloomIn .9s cubic-bezier(.3,1.5,.5,1) forwards}
.in .leaf{animation:bloomIn .8s ease forwards}
@keyframes draw{to{opacity:1}}
@keyframes bloomIn{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
.bouquet g[data-bloom]{transform-box:fill-box;transform-origin:center}
.petal{transform-box:fill-box;transform-origin:50% 100%}
.wilt{animation:wilt 2.6s ease forwards;animation-delay:1.9s}
@keyframes wilt{
  to{opacity:.22;transform:translateY(9px) rotate(-5deg)}
}

/* ---------- scene 6 ---------- */
.close{display:flex;flex-direction:column;align-items:center;gap:2.2rem}
.sig{font-family:var(--display);font-style:italic;font-size:1.35rem;color:var(--gold);opacity:.8}
.hr{width:1px;height:70px;background:linear-gradient(var(--ink-faint),transparent);border:0;margin:0}

.cue{
  font-size:.64rem;letter-spacing:.26em;text-transform:uppercase;
  color:var(--ink-faint);margin-top:2.5rem;
}
.cue::after{
  content:"";display:block;width:1px;height:30px;margin:.7rem auto 0;
  background:linear-gradient(var(--ink-faint),transparent);
  animation:fall 2.4s ease-in-out infinite;
}
@keyframes fall{0%,100%{opacity:.2;transform:scaleY(.5)}50%{opacity:.9;transform:scaleY(1)}}

@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  .r{opacity:1;transform:none;transition:none}
  .w{opacity:1;transform:none;filter:none;animation:none}
  .stem,.petal,.leaf{opacity:1;animation:none}
  .wilt{animation:none;opacity:.3}
  .flame,.cue::after{animation:none}
}
</style>

<canvas id="dust" aria-hidden="true"></canvas>
<div id="glow" aria-hidden="true"></div>

<main class="wrap">

  <!-- 1 -->
  <section class="scene" data-mood="1">
    <svg class="candle r" viewBox="0 0 40 90" aria-hidden="true">
      <ellipse class="flame" cx="20" cy="18" rx="6.5" ry="13" fill="#D9B98C" opacity=".95"/>
      <ellipse class="flame" cx="20" cy="21" rx="3" ry="7" fill="#F2E9E4" opacity=".8"/>
      <rect x="17.5" y="30" width="5" height="6" fill="#6E6260"/>
      <rect x="13" y="34" width="14" height="50" rx="4" fill="#F2E9E4" opacity=".92"/>
      <ellipse cx="20" cy="34" rx="7" ry="2.6" fill="#E8DED8"/>
    </svg>
    <p class="eyebrow r">Hi,</p>
    <h1 data-words>Happy Birthday<span class="name">Zeeniya</span></h1>
    <p class="cue r">scroll</p>
  </section>

  <!-- 2 -->
  <section class="scene" data-mood="2">
    <p class="line" data-words>I dont want this to change anything</p>
  </section>

  <!-- 3 -->
  <section class="scene" data-mood="3">
    <p class="line soft" data-words>but I had made this long back, when I was at vacation</p>
  </section>

  <!-- 4 -->
  <section class="scene" data-mood="4">
    <svg class="bouquet r" viewBox="0 0 240 200" aria-hidden="true">
      <g class="wilt-group">
        <!-- stems -->
        <g stroke="#7D8C7A" stroke-width="2.4" fill="none" stroke-linecap="round">
          <path class="stem" d="M120 190 C118 150 104 118 92 92"  style="animation-delay:.1s"/>
          <path class="stem" d="M120 190 C120 148 120 118 120 86" style="animation-delay:.25s"/>
          <path class="stem" d="M120 190 C122 150 136 118 148 94" style="animation-delay:.4s"/>
          <path class="stem" d="M120 190 C116 158 98 140 76 128"  style="animation-delay:.55s"/>
          <path class="stem" d="M120 190 C124 158 142 140 164 130" style="animation-delay:.7s"/>
        </g>
        <!-- leaves -->
        <g fill="#7D8C7A" opacity=".85">
          <ellipse class="leaf" cx="102" cy="150" rx="13" ry="5" transform="rotate(-28 102 150)" style="animation-delay:.9s"/>
          <ellipse class="leaf" cx="140" cy="158" rx="13" ry="5" transform="rotate(24 140 158)"  style="animation-delay:1s"/>
        </g>
        <!-- blooms -->
        <g data-bloom>
          <g style="animation-delay:1.05s" class="petal"><circle cx="92" cy="88" r="13" fill="#E5A3A3"/><circle cx="92" cy="88" r="5" fill="#D9B98C"/></g>
          <g style="animation-delay:1.2s" class="petal"><circle cx="120" cy="80" r="16" fill="#B06A72"/><circle cx="120" cy="80" r="6" fill="#D9B98C"/></g>
          <g style="animation-delay:1.35s" class="petal"><circle cx="148" cy="90" r="13" fill="#E5A3A3"/><circle cx="148" cy="90" r="5" fill="#D9B98C"/></g>
          <g style="animation-delay:1.5s" class="petal"><circle cx="74" cy="126" r="10" fill="#C98B8B"/><circle cx="74" cy="126" r="4" fill="#D9B98C"/></g>
          <g style="animation-delay:1.65s" class="petal"><circle cx="166" cy="128" r="10" fill="#C98B8B"/><circle cx="166" cy="128" r="4" fill="#D9B98C"/></g>
        </g>
        <!-- tie -->
        <rect class="leaf" x="110" y="168" width="20" height="7" rx="3.5" fill="#D9B98C" opacity=".75" style="animation-delay:1.8s"/>
      </g>
    </svg>
    <p class="line" data-words>I wanted to send you flowers, but..</p>
  </section>

  <!-- 5 -->
  <section class="scene" data-mood="5">
    <p class="line" data-words>I'd have given you my all,Thanks for giving up early</p>
  </section>

  <!-- 6 -->
  <section class="scene" data-mood="6">
    <div class="close">
      <hr class="hr r">
      <p class="line faint" data-words>Take care. Maybe it's just not meant to be.</p>
      <p class="sig r">— z</p>
    </div>
  </section>

</main>

<script>
/* ---------- split text into animated words ---------- */
(function(){
  document.querySelectorAll('[data-words]').forEach(function(el){
    el.querySelectorAll('span, br').forEach(function(){});
    var walk = function(node){
      if(node.nodeType === 3){
        var frag = document.createDocumentFragment();
        node.textContent.split(/(\s+)/).forEach(function(tok){
          if(!tok) return;
          if(/^\s+$/.test(tok)){ frag.appendChild(document.createTextNode(tok)); return; }
          var s = document.createElement('span');
          s.className = 'w'; s.textContent = tok;
          frag.appendChild(s);
        });
        node.parentNode.replaceChild(frag, node);
      } else if(node.nodeType === 1){
        Array.prototype.slice.call(node.childNodes).forEach(walk);
      }
    };
    Array.prototype.slice.call(el.childNodes).forEach(walk);
    el.querySelectorAll('.w').forEach(function(w,i){
      w.style.animationDelay = (0.09*i + 0.1).toFixed(2)+'s';
    });
  });
})();

/* ---------- reveal on scroll ---------- */
(function(){
  var targets = document.querySelectorAll('[data-words], .r, .bouquet, section[data-mood]');
  var mark = function(el){ el.classList.add('in'); };
  if(!('IntersectionObserver' in window)){
    targets.forEach(mark); return;
  }
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){ mark(e.target); io.unobserve(e.target); }
    });
  }, {threshold:.25, rootMargin:'0px 0px -10% 0px'});
  targets.forEach(function(t){ io.observe(t); });
  setTimeout(function(){ targets.forEach(mark); }, 6000);
})();

/* ---------- flowers wilt after they bloom ---------- */
(function(){
  var b = document.querySelector('.bouquet');
  if(!b) return;
  if(!('IntersectionObserver' in window)) return;
  new IntersectionObserver(function(e,obs){
    if(e[0].isIntersecting){
      var g = b.querySelector('.wilt-group');
      g.style.transition = 'opacity 2.6s ease, transform 2.6s ease';
      setTimeout(function(){
        g.style.opacity = '.25';
        g.style.transform = 'translateY(10px) rotate(-4deg)';
        g.style.transformOrigin = '50% 95%';
      }, 2600);
      obs.disconnect();
    }
  },{threshold:.4}).observe(b);
})();

/* ---------- light dims as you descend ---------- */
(function(){
  var glow = document.getElementById('glow');
  var scenes = document.querySelectorAll('section[data-mood]');
  var n = scenes.length;
  if(!('IntersectionObserver' in window)) return;
  new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(!e.isIntersecting) return;
      var i = +e.target.dataset.mood;
      glow.style.opacity = Math.max(0.12, 1 - (i-1)/(n-1) * 0.88).toFixed(2);
    });
  },{threshold:.5}).observe ? scenes.forEach(function(s){
    new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(!e.isIntersecting) return;
        var i = +e.target.dataset.mood;
        glow.style.opacity = Math.max(0.12, 1 - (i-1)/(n-1) * 0.88).toFixed(2);
      });
    },{threshold:.5}).observe(s);
  }) : null;
})();

/* ---------- drifting dust ---------- */
(function(){
  var c = document.getElementById('dust'), x = c.getContext('2d'), m = [], d = 1;
  function size(){
    d = Math.min(window.devicePixelRatio||1, 2);
    c.width = innerWidth*d; c.height = innerHeight*d;
    x.setTransform(d,0,0,d,0,0);
    m = [];
    var n = Math.round(innerWidth*innerHeight/26000);
    for(var i=0;i<n;i++) m.push({
      x:Math.random()*innerWidth, y:Math.random()*innerHeight,
      r:Math.random()*1.5+.4,
      vx:(Math.random()-.5)*.14, vy:-(Math.random()*.16+.04),
      a:Math.random()*.4+.12
    });
  }
  function tick(){
    x.clearRect(0,0,innerWidth,innerHeight);
    for(var i=0;i<m.length;i++){
      var p=m[i];
      p.x+=p.vx; p.y+=p.vy;
      if(p.y < -8){ p.y = innerHeight+8; p.x = Math.random()*innerWidth; }
      if(p.x < -8) p.x = innerWidth+8;
      if(p.x > innerWidth+8) p.x = -8;
      x.beginPath(); x.arc(p.x,p.y,p.r,0,6.283);
      x.fillStyle='rgba(242,233,228,'+p.a.toFixed(2)+')'; x.fill();
    }
    requestAnimationFrame(tick);
  }
  size();
  addEventListener('resize', size);
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches) tick();
})();
</script>
